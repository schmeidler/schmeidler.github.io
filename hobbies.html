<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Hobbies and personal interests of Jaroslav Schmeidler."
  />

  <title>Jaro Schmeidler | Hobbies</title>

  <script data-theme-init>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("site-theme") || "light";
    } catch (e) {
      document.documentElement.dataset.theme = "light";
    }
  </script>

  <link rel="stylesheet" href="style.css?v=44" />

  <style>
    .hobbies-hero{
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:0;
      padding:36px 0 30px;
    }

    .hobbies-hero-main,
    .hobbies-hero-copy{
      border:1px solid var(--page-line);
      background:transparent;
      color:var(--page-fg);
    }

    .hobbies-hero-main{
      position:relative;
      z-index:2;
      min-height:320px;
      display:flex;
      align-items:flex-end;
      padding:34px;
      border-radius:var(--radius);
    }

    .hobbies-hero-copy{
      position:relative;
      z-index:1;
      min-height:320px;
      display:flex;
      align-items:flex-end;
      padding:34px;
      margin-left:-1px;
      border-radius:0;
    }

    .hobbies-hero-main h1{
      margin:0;
      font-family:var(--font-serif);
      font-size:clamp(4rem,9vw,9rem);
      line-height:.85;
      font-weight:400;
      letter-spacing:-.07em;
    }

    .hobbies-hero-copy p{
      margin:0;
      max-width:560px;
      font-family:var(--font-sans);
      font-size:1.05rem;
      line-height:1.5;
      font-weight:300;
    }

    .hobbies-back a{
      gap:7px;
    }

    .hobbies-back svg{
      display:block;
      flex:0 0 auto;
    }

    @media(max-width:760px){
      .hobbies-hero{
        grid-template-columns:1fr;
      }

      .hobbies-hero-main,
      .hobbies-hero-copy{
        min-height:0;
        padding:28px 24px;
      }

      .hobbies-hero-main{
        min-height:250px;
      }

      .hobbies-hero-copy{
        margin-left:0;
        margin-top:-1px;
      }

      .hobbies-hero-main h1{
        font-size:clamp(3.7rem,18vw,5.6rem);
      }
    }
  </style>
</head>

<body>

  <header class="site-header">

    <div class="header-left">

      <div class="language-switch lang-en" aria-label="Language selection">

        <a
          class="lang-link active"
          href="hobbies.html"
          lang="en"
          hreflang="en"
          aria-label="English"
        >
          <span class="flag-frame" aria-hidden="true">
            <svg
              class="flag-icon"
              viewBox="0 0 30 18"
              preserveAspectRatio="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
              focusable="false"
            >
              <g>
                <rect width="30" height="18" fill="#21468B" />
                <path
                  d="M-1 -1L31 19M31 -1L-1 19"
                  stroke="#fff"
                  stroke-width="4"
                  stroke-linecap="butt"
                />
                <path
                  d="M-1 -1L31 19M31 -1L-1 19"
                  stroke="#C8102E"
                  stroke-width="1.5"
                  stroke-linecap="butt"
                />
                <path
                  d="M15 0v18M0 9h30"
                  stroke="#fff"
                  stroke-width="6"
                  stroke-linecap="butt"
                />
                <path
                  d="M15 0v18M0 9h30"
                  stroke="#C8102E"
                  stroke-width="3.2"
                  stroke-linecap="butt"
                />
              </g>
            </svg>
          </span>
        </a>

        <a
          class="lang-link"
          href="hobbies-de.html"
          lang="de"
          hreflang="de"
          aria-label="Deutsch"
        >
          <span class="flag-frame" aria-hidden="true">
            <svg
              class="flag-icon"
              viewBox="0 0 30 18"
              preserveAspectRatio="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
              focusable="false"
            >
              <rect width="30" height="18" fill="#fff" />
              <rect width="30" height="6" y="0" fill="#C8102E" />
              <rect width="30" height="6" y="12" fill="#C8102E" />
            </svg>
          </span>
        </a>

      </div>

      <button
        class="theme-toggle"
        type="button"
        aria-label="Toggle colour scheme"
        aria-pressed="false"
        title="Light / dark mode"
      >
        <span class="theme-track" aria-hidden="true">

          <svg class="theme-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3.5" />
            <path
              d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"
            />
          </svg>

          <svg class="theme-moon" viewBox="0 0 24 24">
            <path d="M19 15.5A8 8 0 0 1 8.5 5a8 8 0 1 0 10.5 10.5z" />
          </svg>

          <span class="theme-knob"></span>

        </span>
      </button>

    </div>

    <button
      class="menu-toggle"
      aria-expanded="false"
      aria-controls="main-nav"
    >
      <span></span>
      <span></span>
      <b class="sr-only">Open menu</b>
    </button>

    <nav id="main-nav" class="nav">
      <a href="index.html#profile">Profile</a>
      <a href="index.html#education">Education</a>
      <a href="index.html#research">Research</a>
      <a href="index.html#experience">Pharma</a>
      <a href="index.html#projects">Projects</a>
      <a href="index.html#hobbies">Hobbies</a>
      <a href="index.html#contact">Contact</a>
    </nav>

  </header>


  <main class="research-page page-shell">

    <section class="hobbies-hero">

      <div class="hobbies-hero-main">
        <h1>Hobbies</h1>
      </div>

      <div class="hobbies-hero-copy">
        <p>
          A small corner for the things I enjoy outside of work.
          This page is for hobbies, personal projects and interests.
          I’ll add selected things here over time.
        </p>
      </div>

    </section>

        <div class="back-row">
          <a href="https://schmeidler.at/index.html#hobbies">
            <svg aria-hidden="true" class="arrow-icon arrow-left" focusable="false" viewbox="0 0 20 20">
                <path d="M15 10H5M9 6l-4 4 4 4">
                </path>
            </svg>
            Back
          </a>
        </div>

  </main>


  <script src="script.js?v=42"></script>

</body>
</html>
