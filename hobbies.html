<!DOCTYPE html>
<html lang="en">

  />

  <title>Hobbies | Jaro Schmeidler</title>

  <script data-theme-init>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("site-theme") || "light";
    } catch (e) {
      document.documentElement.dataset.theme = "light";
    }
  </script>

  <link rel="stylesheet" href="style.css?v=44" />

  <style>
    .hobbies-back a {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-sans);
      font-size: .9rem;
      line-height: 1.25;
      font-weight: 500;
      text-decoration: none;
    }

    .hobbies-back a:hover {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .hobbies-back svg {
      display: block;
      flex: 0 0 auto;
    }
  </style>
</head>

<body>

  <header class="site-header">

    <div class="header-left">

      <div class="language-switch lang-en" aria-label="Language selection">

        <a
          class="lang-link active"
          href="hobbies.html"
          lang="en"
          hreflang="en"
          aria-label="English"
        >
          <span class="flag-frame" aria-hidden="true">

              class="flag-icon"
              viewBox="0 0 30 18"
              preserveAspectRatio="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
              focusable="false"

              <g>
                <rect width="30" height="18" fill="#21468B" />

                <path
                  d="M-1 -1L31 19M31 -1L-1 19"
                  stroke="#fff"
                  stroke-width="4"
                  stroke-linecap="butt"
                />

                <path
                  d="M-1 -1L31 19M31 -1L-1 19"
                  stroke="#C8102E"
                  stroke-width="1.5"
                  stroke-linecap="butt"
                />

                <path
                  d="M15 0v18M0 9h30"

                  stroke-width="6"
                  stroke-linecap="butt"
                />

                <path
                  d="M15 0v18M0 9h30"
                  stroke="#C8102E"
                  stroke-width="3.2"
                  stroke-linecap="butt"
                />
              </g>
            </svg>
          </span>
        </a>

        <a
          class="lang-link"
          href="hobbies-de.html"
          lang="de"
          hreflang="de"

        >
          <span class="flag-frame" aria-hidden="true">
            <svg
              class="flag-icon"
              viewBox="0 0 30 18"
              preserveAspectRatio="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
              focusable="false"
            >
              <rect width="30" height="18" fill="#fff" />
              <rect width="30" height="6" y="0" fill="#C8102E" />
              <rect width="30" height="6" y="12" fill="#C8102E" />
            </svg>
          </span>
        </a>

      </div>

      <button
        class="theme-toggle"
        type="button"
        aria-label="Toggle colour scheme"
        aria-pressed="false"
        title="Light / dark mode"
      >
        <span class="theme-track" aria-hidden="true">

          <svg class="theme-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3.5" />
            <path
              d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"

          </svg>

          <svg class="theme-moon" viewBox="0 0 24 24">
            <path d="M19 15.5A8 8 0 0 1 8.5 5a8 8 0 1 0 10.5 10.5z" />
          </svg>

          <span class="theme-knob"></span>

        </span>
      </button>

    </div>


    <button
      class="menu-toggle"
      aria-expanded="false"
      aria-controls="main-nav"

      <span></span>

      <p>
        A small corner for the things I enjoy outside of work.
      </p>
    </section>


    <section class="project-detail hobby-detail">

      <div class="project-detail-grid">

        <div>
          <p class="meta">Personal</p>

          <h2>
            See what I do in my free time.
          </h2>
        </div>


        <div class="detail-copy">
          <p>
            This page is for hobbies, personal projects and interests.
            I’ll add selected things here over time.
          </p>
        </div>

    <div class="back-row hobbies-back">

      <a href="index.html#hobbies" aria-label="Back to hobbies on CV">

        <svg
          aria-hidden="true"
          focusable="false"
          viewBox="0 0 20 20"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 10H5M9 6l-4 4 4 4"></path>
        </svg>

        <span>Back to CV</span>

      </a>

    </div>

</html>
